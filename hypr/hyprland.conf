##############################################
#   NOCTIS — Hyprland Configuration         #
##############################################
#
# INSTRUCCIONES DE INSTALACIÓN:
# 1. Copia ~/.config/hypr/* a la ruta equivalente en el otro equipo
# 2. Instala las dependencias: waybar, dunst, wofi, kitty, hypridle,
#    hyprlock, grimblast, cliphist, swaybg, wl-clipboard, playerctl,
#    brightnessctl, wpctl (wireplumber), jetbrains-mono-nerd
# 3. Edita las variables de aplicaciones abajo si usas otras
# 4. Pon una imagen como wallpaper en ~/Pictures/wallpaper.png
#    o edita hyprpaper.conf con tu ruta
# 5. Corre: hyprctl reload
#
##############################################

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/animations.conf


# ══════════════════════════════════════════════
# VARIABLES DE APLICACIONES — Edita aquí
# ══════════════════════════════════════════════
$terminal    = kitty
$browser     = firefox
$filemanager = dolphin
$launcher    = wofi --show drun --style ~/.config/wofi/style.css
$lockscreen  = pidof hyprlock || hyprlock
$spotify     = spotify

# ══════════════════════════════════════════════
# MONITORES
# ══════════════════════════════════════════════
monitor = DP-2, 1920x1080@144, 0x0, 1

# ══════════════════════════════════════════════
# AUTOSTART
# ══════════════════════════════════════════════
exec-once = waybar
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = hyprpaper

# ══════════════════════════════════════════════
# ENTORNO
# ══════════════════════════════════════════════
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,kde

# ══════════════════════════════════════════════
# INPUT
# ══════════════════════════════════════════════
input {
    kb_layout = es
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

# ══════════════════════════════════════════════
# APARIENCIA
# ══════════════════════════════════════════════
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(bd00ffFF) rgba(7b00d4FF) 45deg
    col.inactive_border = rgba(1a1a2eFF)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92
    dim_inactive = true
    dim_strength = 0.15
    dim_special = 0.3
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(bd00ff33)
        color_inactive = rgba(0a0a0f66)
        offset = 0, 4
        scale = 1.0
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ══════════════════════════════════════════════
# LAYER RULES — Blur en barra y launcher
# ══════════════════════════════════════════════
layerrule {
    name = waybar-blur
    match:namespace = waybar
    blur = true
}

layerrule {
    name = wofi-blur
    match:namespace = wofi
    blur = true
}

# ══════════════════════════════════════════════
# KEYBINDS + WINDOW RULES (modular)
# ══════════════════════════════════════════════
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
