####################################################################
# ANIMATIONS.CONF — Animaciones de Hyprland
# Modifica las curvas y duraciones para personalizar el feeling.
# Desactiva secciones si quieres un sistema más rápido/ligero.
####################################################################

animations {
    enabled = true

    # ── Curvas de animación personalizadas (bezier) ───────────────
    # Formato: bezier = nombre, x0, y0, x1, y1
    bezier = overshot,    0.05, 0.9,  0.1,  1.05   # Efecto "bounce" suave
    bezier = smoothOut,   0.5,  0,    1,    0.5    # Salida suavizada
    bezier = smoothIn,    0.5,  -0.5, 0.68, 1.5    # Entrada con overshoot
    bezier = cyberpunk,   0.16, 1,    0.3,  1      # Curva característica cyberpunk (sharp start)
    bezier = linear,      1,    1,    1,    1       # Lineal (útil para fades)
    bezier = snappy,      0.25, 1,    0.5,  1       # Rápido y preciso

    # ── Animaciones de ventanas ───────────────────────────────────
    # animation = tipo, activar (0/1), duración (ms/10), curva [, subtipo]
    animation = windows,     1, 4,  cyberpunk, slide     # Apertura de ventanas: slide
    animation = windowsOut,  1, 3,  smoothOut, slide     # Cierre de ventanas
    animation = windowsMove, 1, 3,  snappy               # Mover ventanas
    animation = border,      1, 6,  linear               # Animación del borde activo
    animation = borderangle, 1, 40, linear, loop         # Rotación del gradiente del borde ✨

    # ── Animaciones de fade ───────────────────────────────────────
    animation = fade,        1, 4,  smoothIn             # Fade general
    animation = fadeIn,      1, 4,  smoothIn             # Fade al aparecer
    animation = fadeOut,     1, 3,  smoothOut            # Fade al desaparecer
    animation = fadeSwitch,  1, 4,  cyberpunk            # Fade al cambiar workspace
    animation = fadeShadow,  1, 4,  linear               # Fade de sombras
    animation = fadeDim,     1, 4,  linear               # Fade al quedar inactiva

    # ── Animaciones de workspaces ─────────────────────────────────
    animation = workspaces,  1, 5,  cyberpunk, slidevert # Cambio de workspace: vertical
    # Alternativas: slide, slidevert, fade, slidefadevert
}
