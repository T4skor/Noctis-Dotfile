##############################################
#   NOCTIS — Hyprlock (Blur Premium)        #
##############################################
# Pantalla de bloqueo con blur pesado,
# estilo cyberpunk morado (paleta Noctis).

# ══════════════════════════════════════════════
# FONDO — Wallpaper con blur intenso
# ══════════════════════════════════════════════
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.012
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.20
    vibrancy_darkness = 0.1
}

# ══════════════════════════════════════════════
# RELOJ — Hora grande centrada
# ══════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(224, 215, 255, 0.95)
    font_size = 120
    font_family = JetBrains Mono ExtraBold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(189, 0, 255, 0.35)
    shadow_boost = 0.8
    position = 0, 200
    halign = center
    valign = center
}

# ══════════════════════════════════════════════
# FECHA — Debajo del reloj
# ══════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(157, 142, 196, 0.85)
    font_size = 18
    font_family = JetBrains Mono
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(189, 0, 255, 0.2)
    position = 0, 110
    halign = center
    valign = center
}

# ══════════════════════════════════════════════
# ICONO DE USUARIO — Emoji/glifo decorativo
# ══════════════════════════════════════════════
label {
    monitor =
    text = 󰊠
    color = rgba(189, 0, 255, 0.7)
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(189, 0, 255, 0.3)
    position = 0, 20
    halign = center
    valign = center
}

# ══════════════════════════════════════════════
# CAMPO DE CONTRASEÑA — Input estilizado
# ══════════════════════════════════════════════
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(189, 0, 255, 0.55)
    inner_color = rgba(10, 10, 15, 0.82)
    font_color = rgba(224, 215, 255, 1.0)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##9d8ec4">󰌾  contraseña</span>
    hide_input = false
    rounding = 12
    check_color = rgba(0, 255, 157, 0.8)
    fail_color = rgba(255, 45, 107, 0.9)
    fail_text = <i>  Incorrecto ($ATTEMPTS)</i>
    fail_transition = 200
    capslock_color = rgba(255, 170, 0, 0.8)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(189, 0, 255, 0.25)
    position = 0, -60
    halign = center
    valign = center
}

# ══════════════════════════════════════════════
# NOMBRE DE USUARIO
# ══════════════════════════════════════════════
label {
    monitor =
    text = $USER@arch
    color = rgba(0, 212, 255, 0.55)
    font_size = 12
    font_family = JetBrains Mono
    position = 0, -120
    halign = center
    valign = center
}

# ══════════════════════════════════════════════
# DECORACIONES LATERALES — Líneas cyberpunk
# ══════════════════════════════════════════════

# Línea decorativa izquierda
label {
    monitor =
    text = ────────
    color = rgba(189, 0, 255, 0.2)
    font_size = 14
    font_family = JetBrains Mono
    position = -220, -60
    halign = center
    valign = center
}

# Línea decorativa derecha
label {
    monitor =
    text = ────────
    color = rgba(189, 0, 255, 0.2)
    font_size = 14
    font_family = JetBrains Mono
    position = 220, -60
    halign = center
    valign = center
}

# ══════════════════════════════════════════════
# INDICADORES INFERIORES
# ══════════════════════════════════════════════

# Estado de bloqueo
label {
    monitor =
    text = 󰍁  bloqueado
    color = rgba(157, 142, 196, 0.35)
    font_size = 11
    font_family = JetBrains Mono
    position = 0, 40
    halign = center
    valign = bottom
}
