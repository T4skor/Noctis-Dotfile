####################################################################
# WINDOWRULES.CONF — Reglas de ventanas (Hyprland 0.54+)
# Sintaxis: windowrule { name = <id>, match:class/title = <regex>, <efectos> }
# Nota: idleinhibit fue eliminado, usar hypridle en su lugar.
####################################################################

# ══════════════════════════════════════════════
# FLOTANTES — Ventanas que siempre aparecen flotando
# ══════════════════════════════════════════════

windowrule {
    name = pavucontrol-float
    match:class = ^(pavucontrol)$
    float = 1
    center = 1
    size = 800 600
}

windowrule {
    name = blueman-float
    match:class = ^(blueman-manager)$
    float = 1
    center = 1
    size = 900 600
}

windowrule {
    name = nm-editor-float
    match:class = ^(nm-connection-editor)$
    float = 1
    center = 1
}

windowrule {
    name = lxappearance-float
    match:class = ^(lxappearance)$
    float = 1
}

windowrule {
    name = qt5ct-float
    match:class = ^(qt5ct)$
    float = 1
}

windowrule {
    name = thunar-dialogs-float
    match:class = ^(thunar)$
    match:title = ^(Copiar|Mover|Confirmar)
    float = 1
}

windowrule {
    name = pip-float
    match:title = ^(Picture-in-Picture)$
    float = 1
    center = 1
}

windowrule {
    name = image-viewer-float
    match:title = ^(Visor de imágenes)$
    float = 1
}

# ══════════════════════════════════════════════
# TRANSPARENCIA POR APP
# ══════════════════════════════════════════════

windowrule {
    name = kitty-style
    match:class = ^(kitty)$
    opacity = 0.95 0.85
    border_color = rgba(bd00ffFF)
}

windowrule {
    name = thunar-opacity
    match:class = ^(thunar)$
    opacity = 0.97 0.90
}

windowrule {
    name = firefox-opacity
    match:class = ^(firefox)$
    opacity = 1.0 0.95
}

windowrule {
    name = mpv-opacity
    match:class = ^(mpv)$
    opacity = 1.0 1.0
}

windowrule {
    name = discord-opacity
    match:class = ^(discord)$
    opacity = 0.95 0.88
}

windowrule {
    name = vscode-opacity
    match:class = ^(code-oss)$
    opacity = 0.97 0.92
}


# ══════════════════════════════════════════════
# IGNORAR — Desactiva blur/sombra para ciertas ventanas
# ══════════════════════════════════════════════

windowrule {
    name = firefox-devtools-noblur
    match:class = ^(firefox)$
    match:title = ^(Firefox Developer Edition)$
    no_blur = 1
}

windowrule {
    name = waybar-noshadow
    match:class = ^(waybar)$
    no_shadow = 1
}
