####################################################################
# COLORS.CONF — Paleta de colores central (Cyberpunk Morado)
# Modifica AQUÍ para cambiar toda la estética de una vez.
# Los colores se usan en hyprland.conf, waybar, wofi, kitty, etc.
####################################################################

# ── Colores base ──────────────────────────────
$background   = rgba(0a0a0fFF)    # Negro casi puro (fondo principal)
$backgroundAlt= rgba(0f0f1aFF)    # Negro azulado (fondos secundarios)
$surface      = rgba(1a1a2eFF)    # Superficie de tarjetas/paneles
$overlay      = rgba(16213eFF)    # Overlay oscuro

# ── Acentos morados (cyberpunk signature) ────
$accent       = rgba(bd00ffFF)    # Morado neón principal
$accentDark   = rgba(7b00d4FF)    # Morado más oscuro
$accentLight  = rgba(d966ffFF)    # Morado claro / highlight

# ── Colores de texto ─────────────────────────
$textPrimary  = rgba(e0d7ffFF)    # Blanco lavanda (texto principal)
$textSecondary= rgba(9d8ec4FF)    # Morado claro (texto secundario)
$textDisabled = rgba(4a4a6aFF)    # Gris morado (texto deshabilitado)

# ── Colores de estado ─────────────────────────
$success      = rgba(00ff9dFF)    # Verde neón (éxito)
$warning      = rgba(ffaa00FF)    # Ámbar (advertencia)
$error        = rgba(ff2d6bFF)    # Rosa/rojo neón (error)
$info         = rgba(00d4ffFF)    # Cyan (información)

# ── Colores de workspace ──────────────────────
$workspaceActive   = rgba(bd00ffFF)
$workspaceInactive = rgba(1a1a2eFF)
$workspaceUrgent   = rgba(ff2d6bFF)
