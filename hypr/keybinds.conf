####################################################################
# KEYBINDS.CONF — Atajos de teclado
# $mainMod = Super (tecla Windows)
# Cambia $mainMod por ALT si prefieres
####################################################################

$mainMod = SUPER

# ══════════════════════════════════════════════
# APLICACIONES — Abrir programas
# ══════════════════════════════════════════════
bind = $mainMod, Return,      exec, $terminal           # Abrir terminal (Kitty)
bind = $mainMod, B,           exec, $browser             # Abrir navegador
bind = $mainMod, E,           exec, $filemanager         # Abrir gestor de archivos
bind = $mainMod, Space,       exec, $launcher            # Lanzador de apps (Wofi)
bind = $mainMod, L,           exec, $lockscreen          # Bloquear pantalla
bind = $mainMod, S,           exec, $spotify             # Abrir Spotify
bind = $mainMod SHIFT, S,     exec, grimblast copy area  # Captura de pantalla (área)
bind = ,         Print,       exec, grimblast copy screen # Captura de pantalla (completa)
bind = $mainMod, V,           exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy  # Portapapeles

# ── Scratchpad (workspace especial oculto) ────
bind = $mainMod, grave, togglespecialworkspace, scratchpad         # Super + ` = mostrar/ocultar
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratchpad  # Super + Shift + ` = enviar ventana

# ══════════════════════════════════════════════
# GESTIÓN DE VENTANAS
# ══════════════════════════════════════════════
bind = $mainMod, Q,           killactive              # Cerrar ventana activa
bind = $mainMod, F,           fullscreen, 0           # Pantalla completa
bind = $mainMod SHIFT, F,     fullscreen, 1           # Maximizar (sin bordes)
bind = $mainMod, T,           togglefloating          # Alternar flotante/tileado
bind = $mainMod, P,           pseudo                  # Modo pseudotile
bind = $mainMod, C,           centerwindow            # Centrar ventana flotante

# ── Mover foco entre ventanas ─────────────────
bind = $mainMod, left,        movefocus, l
bind = $mainMod, right,       movefocus, r
bind = $mainMod, up,          movefocus, u
bind = $mainMod, down,        movefocus, d
bind = $mainMod, H,           movefocus, l            # Vim-style
bind = $mainMod, K,           movefocus, u
bind = $mainMod, J,           movefocus, d
# Nota: SUPER+L = lockscreen, usar flecha derecha para foco derecha

# ── Mover ventanas ────────────────────────────
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d
bind = $mainMod SHIFT, H,     movewindow, l
bind = $mainMod SHIFT, L,     movewindow, r
bind = $mainMod SHIFT, K,     movewindow, u
bind = $mainMod SHIFT, J,     movewindow, d

# ── Redimensionar ventanas ────────────────────
binde = $mainMod CTRL, left,  resizeactive, -30 0
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, up,    resizeactive, 0 -30
binde = $mainMod CTRL, down,  resizeactive, 0 30
binde = $mainMod CTRL, H,     resizeactive, -30 0
binde = $mainMod CTRL, L,     resizeactive, 30 0
binde = $mainMod CTRL, K,     resizeactive, 0 -30
binde = $mainMod CTRL, J,     resizeactive, 0 30

# ══════════════════════════════════════════════
# WORKSPACES — Cambiar y mover entre escritorios
# ══════════════════════════════════════════════

# Ir al workspace 1-9 y 0 (→ 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana activa al workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Navegar workspaces con flechas laterales
bind = $mainMod, bracketright, workspace, e+1     # Super + ]
bind = $mainMod, bracketleft,  workspace, e-1     # Super + [

# ══════════════════════════════════════════════
# RATÓN — Mover y redimensionar con mouse
# ══════════════════════════════════════════════
bindm = $mainMod, mouse:272, movewindow          # Super + clic izq = mover
bindm = $mainMod, mouse:273, resizewindow        # Super + clic der = redimensionar
bind  = $mainMod, mouse_down, workspace, e+1     # Scroll sobre barra
bind  = $mainMod, mouse_up,   workspace, e-1

# ══════════════════════════════════════════════
# MULTIMEDIA — Volumen, brillo y reproducción
# ══════════════════════════════════════════════
bind = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp,   exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86AudioPlay,         exec, playerctl play-pause
bind = , XF86AudioNext,         exec, playerctl next
bind = , XF86AudioPrev,         exec, playerctl previous

# ══════════════════════════════════════════════
# HYPRLAND — Sistema
# ══════════════════════════════════════════════
bind = $mainMod SHIFT, Q,     exit                                              # Salir de Hyprland
bind = $mainMod SHIFT, R,     exec, hyprctl reload                              # Recargar configuración
bind = $mainMod SHIFT, W,     exec, ~/.config/hypr/scripts/wallpaper-selector.sh # Cambiar fondo
