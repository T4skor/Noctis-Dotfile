##############################################
#   NOCTIS — Kitty terminal config          #
##############################################

# ── Font ────────────────────────────────────
font_family      JetBrains Mono
bold_font        JetBrains Mono ExtraBold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono ExtraBold Italic
font_size        12.0
adjust_line_height  2

# ── Cursor ──────────────────────────────────
cursor                  #00e5c5
cursor_text_color       #0a0c10
cursor_shape            block
cursor_blink_interval   0.5
cursor_stop_blinking_after 0

# ── Scrollback ──────────────────────────────
scrollback_lines 10000

# ── Mouse ───────────────────────────────────
mouse_hide_wait 2.0
url_color #5eb4ff
url_style curly
open_url_with default

# ── Performance ─────────────────────────────
sync_to_monitor yes
input_delay 1
repaint_delay 8

# ── Bell ────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Window ──────────────────────────────────
remember_window_size  no
initial_window_width  960
initial_window_height 580
window_padding_width  12
window_margin_width   0
single_window_margin_width -1
hide_window_decorations titlebar-only
confirm_os_window_close 0

# ── Transparency & Blur ─────────────────────
background_opacity  0.70
background_blur     20

# ── Tab bar ─────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #0a0c10
active_tab_background   #00e5c5
active_tab_font_style   bold
inactive_tab_foreground #7a86a8
inactive_tab_background #10131a
inactive_tab_font_style normal
tab_bar_background      #0a0c10
tab_bar_min_tabs        2

# ── Colors — NOCTIS palette ─────────────────

# Base
background            #080e10
foreground            #c5cfe8
selection_background  #0e1620
selection_foreground  #c5cfe8

# Black
color0   #10131a
color8   #2d3347

# Red
color1   #ff6b7a
color9   #ff8a96

# Green
color2   #c3e88d
color10  #d4f0a4

# Yellow
color3   #ffc777
color11  #ffd599

# Blue
color4   #5eb4ff
color12  #82c8ff

# Magenta
color5   #a78bfa
color13  #c099ff

# Cyan  ← accent
color6   #00e5c5
color14  #3df0d5

# White
color7   #c5cfe8
color15  #dde4f0

# ── Keyboard shortcuts ───────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+right    next_tab
map ctrl+left     previous_tab
map ctrl+equal    increase_font_size
map ctrl+minus    decrease_font_size
map ctrl+0        restore_font_size
map ctrl+shift+r  load_config_file
